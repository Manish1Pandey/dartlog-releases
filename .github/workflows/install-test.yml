# Installs a published DartLog release on fresh Linux, Windows and macOS
# machines, checks that it runs, then uninstalls it.
# Runs only when started by hand: Actions tab -> "Install test" -> Run workflow.
name: Install test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to test, e.g. 0.1.0 (empty: the latest)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x64",     os: ubuntu-latest }
          - { name: "Linux ARM",     os: ubuntu-24.04-arm }
          - { name: "Windows x64",   os: windows-latest }
          - { name: "Windows ARM",   os: windows-11-arm }
          - { name: "macOS ARM",     os: macos-latest }
    env:
      DARTLOG_CHECK_UPDATES: "0"
      VERSION: ${{ inputs.version }}
    steps:
      - name: Download the installer
        shell: bash
        run: |
          if [ -n "$VERSION" ]; then url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION#v}/setup.py"
          else url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/setup.py"; fi
          curl -fsSL "$url" -o setup.py
          ls -la setup.py

      - name: Install DartLog
        shell: bash
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          args="install -y --no-browser --no-adb --no-service --port 9300"
          [ -n "$VERSION" ] && args="$args --release ${VERSION#v}"
          $py setup.py $args

      - name: Check that DartLog answers
        shell: bash
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9300/healthz && break; sleep 2; done
          echo
          info=$(curl -fsS http://127.0.0.1:9300/api/v1/info); echo "$info"
          echo "$info" | grep -q '"name":"DartLog"'
          curl -fsS http://127.0.0.1:9300/ | grep -qi '<html' && echo "dashboard page served"

      - name: Doctor
        if: always()
        shell: bash
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          $py setup.py doctor --port 9300 || true

      - name: Uninstall
        if: always()
        shell: bash
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          $py setup.py uninstall -y --port 9300

      - name: Keep the setup log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-log-${{ matrix.os }}
          path: |
            ~/.dartlog/setup.log
            ~/.dartlog/dartlog.log
          if-no-files-found: ignore
